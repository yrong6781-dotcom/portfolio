<head>
  <meta charset="UTF-8" />

  <meta name="theme-color" content="#11111b" />
  <title>Driveletics | Rong Yan</title>
  <link rel="icon" type="image/png" sizes="32x32" href="src/png/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="src/png/favicon-192.png" />

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code&display=swap" />
  <link rel="stylesheet" href="project-detail.css?v=10" />
  <script>
    // zoom the first page in when the browser did not morph it from the project card
    (function () {
      var root = document.documentElement;
      if ("onpagereveal" in window) {
        window.addEventListener("pagereveal", function (e) {
          if (!e.viewTransition) {
            root.classList.add("enter-zoom");
            return;
          }
          // a skipped transition rejects these promises, which is expected
          e.viewTransition.ready.catch(function () {});
          e.viewTransition.finished.catch(function () {});
        }, { once: true });
      } else {
        root.classList.add("enter-zoom");
      }
    })();
  </script>
  <script src="project-detail.js?v=5" defer></script>
  <script src="site-extras.js?v=4" defer></script>
</head>

<body>
  <header class="detail-bar">
    <a class="detail-back" href="index.html#projects" aria-label="Back to projects">&#8592; &#60;/Projects&#62;</a>
    <div class="detail-bar-right">
      <div class="detail-bar-info">
        <span class="detail-bar-title">Driveletics</span>
        <span class="detail-bar-meta">UX设计 · 车载 HUD + 司机端 App</span>
      </div>
      <button class="detail-sound" type="button" aria-pressed="false" aria-label="打开背景音乐"></button>
    </div>
  </header>

  <main class="detail-main">
    <div class="detail-pages">
      <!-- project video: paused on its first frame until the visitor presses play -->
      <figure class="detail-video" style="view-transition-name: driveletics-cover">
        <video src="src/projects/driveletics/driveletics.mp4" poster="src/projects/driveletics/poster.jpg" width="1280" height="720" preload="metadata" playsinline aria-label="Driveletics 疲劳驾驶干预系统 项目视频"></video>
        <button class="detail-video-play" type="button" aria-label="播放视频"></button>
      </figure>
    </div>

    <div class="detail-end">
      <a class="detail-back" href="index.html#projects">&#8592; Back to projects</a>
    </div>
  </main>
</body>

</html>
