    // zoom the first page in when the browser did not morph it from the project card
    (function () {
      var root = document.documentElement;
      if ("onpagereveal" in window) {
        window.addEventListener("pagereveal", function (e) {
          if (!e.viewTransition) {
            root.classList.add("enter-zoom");
            return;
          }
          // a skipped transition rejects these promises, which is expected
          e.viewTransition.ready.catch(function () {});
          e.viewTransition.finished.catch(function () {});
        }, { once: true });
      } else {
        root.classList.add("enter-zoom");
      }
    })();
  </script>

  <script>
    // background music pauses while the video plays and resumes afterwards if the sound switch is still on
    (function () {
      var video = document.querySelector(".detail-video");
      var toggle = document.querySelector(".detail-sound");
      function music() { return document.querySelector("body > audio"); }
      video.addEventListener("play", function () {
        var a = music();
        if (a && !a.paused) a.pause();
      });
      function resume() {
        var a = music();
        if (a && toggle && toggle.getAttribute("aria-pressed") === "true") a.play().catch(function () {});
      }
      video.addEventListener("pause", resume);
      video.addEventListener("ended", resume);
    })();
  </script>
