<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --ink:#080C0B; --ink-2:#121918; --mint:#00E3A1; --mint-2:#1FF0B4; --mint-deep:#0B8F6C;
  --mint-wash:#E6FAF3; --lav:#6C5CE7; --lav-wash:#EEEBFD; --amber:#F2A33C; --amber-wash:#FFF6E8;
  --red:#F2564B;
  --page:#11111B; --page-2:#0B0F14;
  --scr:#F3F5F5; --card:#FFFFFF; --t1:#0C1413; --t2:#6C7A78; --t3:#9AA6A4; --line:#E7EBEA;
  --cap:#2FD6A6; --head:#F2FBF8; --head-dim:rgba(234,243,241,.62);
  --s:1;
  --ff:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter",system-ui,sans-serif;
}

*{box-sizing:border-box}
body.proto-body{
  margin:0; background:var(--page);
  background-image:
    radial-gradient(120% 80% at 50% -10%, rgba(0,227,161,.16), transparent 60%),
    linear-gradient(180deg, var(--page) 0%, var(--page-2) 100%);
  min-height:100vh; -webkit-font-smoothing:antialiased;
}
.proto{font-family:var(--ff); color:var(--head)}
.detail-main{padding-top:4px}
.proto{padding-block:28px 40px; padding-left:16px; padding-right:16px; margin:0 auto; max-width:1180px;
  display:grid; grid-template-columns:minmax(260px,400px) auto; gap:clamp(28px,5vw,72px);
  align-items:center; justify-content:center}
.proto-head{display:flex; flex-direction:column; align-items:flex-start; gap:22px; text-align:left; max-width:42ch}
.proto-mark{line-height:0}
.proto h1{margin:0; font-size:clamp(26px,3.4vw,36px); font-weight:800; letter-spacing:-.03em; color:var(--head); line-height:1.1}
.proto h1 span{display:block; margin-top:9px; font-size:.58em; font-weight:700; letter-spacing:-.01em; color:var(--cap)}
.chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:4px}
.chip{font-family:inherit; font-size:12.5px; font-weight:600; letter-spacing:.01em; color:var(--head-dim);
  background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.12); border-radius:999px;
  padding:8px 15px; cursor:pointer; transition:color .18s ease, background .18s ease, border-color .18s ease, transform .14s ease}
.chip:hover{color:var(--head); border-color:rgba(0,227,161,.45)}
.chip:active{transform:scale(.96)}
.chip.on{color:#04211A; background:var(--mint); border-color:transparent}
.proto-right{display:flex; flex-direction:column; align-items:center}
.proto-stage{position:relative}
.proto-stage::before{content:""; position:absolute; left:50%; top:8%; width:118%; height:84%;
  transform:translateX(-50%); background:radial-gradient(50% 50% at 50% 50%, rgba(0,227,161,.2), transparent 70%);
  filter:blur(28px); pointer-events:none}
.stage{position:relative; width:calc(375px * var(--s)); height:calc(812px * var(--s))}
.cap{margin:20px 0 0; font-size:12.5px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--cap); text-align:center}

/* ---------- phone chrome ---------- */
.phone{
  width:375px; height:812px; transform:scale(var(--s)); transform-origin:top left;
  border-radius:54px; padding:11px; background:linear-gradient(160deg,#3a3f44,#15181b 42%,#2b3034);
  box-shadow:0 40px 90px rgba(0,0,0,.55), 0 0 70px rgba(0,227,161,.1), 0 2px 0 rgba(255,255,255,.14) inset;
  position:relative;
}
.screen{width:100%; height:100%; border-radius:44px; overflow:hidden; background:var(--scr); position:relative; display:flex; flex-direction:column; color:var(--t1)}
.island{position:absolute; top:10px; left:50%; transform:translateX(-50%); width:120px; height:33px; border-radius:20px; background:#05070A; z-index:40; display:flex; align-items:center; justify-content:flex-end; padding-right:9px}
.island i{width:9px;height:9px;border-radius:50%;background:#10201f; box-shadow:0 0 0 1px rgba(255,255,255,.06) inset}
.statusbar{height:54px; flex:0 0 54px; display:flex; align-items:center; justify-content:space-between; padding:0 26px 0 30px; font-size:15px; font-weight:700; letter-spacing:.01em; position:relative; z-index:30}
.statusbar .sbr{display:flex; align-items:center; gap:5px}
.dark .statusbar, .dark .island i{color:#fff}

/* ---------- app surface ---------- */
.body{flex:1; overflow-y:auto; overflow-x:hidden; padding:0 18px 22px; scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.backrow{display:flex; align-items:center; gap:4px; font-size:14px; font-weight:600; color:var(--t2); background:none; border:0; padding:6px 0 10px; cursor:pointer; font-family:inherit}
.backrow:hover{color:var(--t1)}
h2.title{font-size:27px; font-weight:800; letter-spacing:-.025em; margin:0}
.sub{margin:3px 0 0; font-size:13.5px; color:var(--t2)}
.sec{font-size:17px; font-weight:800; letter-spacing:-.02em; margin:20px 0 10px}
.card{background:var(--card); border-radius:16px; padding:14px; box-shadow:0 1px 2px rgba(12,20,19,.05)}
.lab{font-size:10px; font-weight:800; letter-spacing:.11em; text-transform:uppercase; color:var(--t3)}
.tnum{font-variant-numeric:tabular-nums}

/* black hero cards */
.hero{background:linear-gradient(155deg,#151D1B 0%,#070B0A 58%,#0B1412 100%); border-radius:20px; padding:16px 16px 14px; color:#fff; position:relative; overflow:hidden}
.hero::after{content:""; position:absolute; inset:0; background:radial-gradient(90% 120% at 88% 8%, rgba(0,227,161,.18), transparent 62%); pointer-events:none}
.hero .lab{color:rgba(255,255,255,.52)}

/* score */
.scorerow{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:8px}
.score{font-size:62px; line-height:.94; font-weight:800; color:var(--mint); letter-spacing:-.045em}
.score-sub{font-size:13px; color:rgba(255,255,255,.72); margin-top:8px; font-weight:500}
.pill-ok{margin-top:12px; display:flex; align-items:center; gap:7px; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.1); border-radius:11px; padding:8px 10px; font-size:11.5px; color:rgba(255,255,255,.8)}

/* tiles */
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:11px}
.tile{background:var(--card); border-radius:15px; padding:12px 13px}
.tile .k{font-size:11.5px; color:var(--t2); font-weight:600}
.tile .v{font-size:21px; font-weight:800; letter-spacing:-.03em; margin-top:5px; display:flex; align-items:center; gap:6px}
.dot-ok{width:7px;height:7px;border-radius:50%;background:var(--mint-deep); display:inline-block}

.rowcard{display:flex; align-items:center; gap:11px; background:var(--card); border:1px solid var(--line); border-radius:15px; padding:12px 13px}
.ico{width:34px;height:34px;border-radius:11px; display:grid; place-items:center; flex:0 0 34px; background:var(--mint-wash); color:var(--mint-deep)}
.btn{font-family:inherit; font-size:12.5px; font-weight:700; border-radius:999px; border:1px solid var(--line); background:var(--scr); color:var(--t1); padding:8px 15px; cursor:pointer; transition:transform .12s ease, background .15s ease}
.btn:hover{background:#E8ECEB} .btn:active{transform:scale(.95)}
.btn[disabled]{opacity:.55; cursor:default}
.btn-mint{background:var(--mint-wash); border-color:transparent; color:var(--mint-deep)}
.btn-mint:hover{background:#D5F5EA}

/* progress */
.bar{height:6px; border-radius:99px; background:var(--line); overflow:hidden}
.bar>i{display:block; height:100%; border-radius:99px; background:linear-gradient(90deg,var(--mint-deep),var(--mint)); transition:width .5s cubic-bezier(.4,0,.2,1)}
.bar.dark{background:rgba(255,255,255,.14)}
.bar.thin{height:4px}

/* session list */
.sess{display:flex; align-items:flex-start; gap:11px; width:100%; text-align:left; font-family:inherit; cursor:pointer; background:var(--card); border:1px solid var(--line); border-radius:15px; padding:12px 13px; transition:border-color .16s ease, background .16s ease, transform .12s ease}
.sess:hover{border-color:#CFDAD7}
.sess:active{transform:scale(.985)}
.sess.on{background:var(--lav-wash); border-color:#D9D2FB}
.sess.pick{box-shadow:0 0 0 2px var(--mint-deep)}
.sess .nm{font-size:14.5px; font-weight:700; letter-spacing:-.01em}
.sess.on .nm{color:var(--lav)}
.sess .tm{font-size:12px; color:var(--t2); margin-top:2px}
.sess .mn{font-size:15px; font-weight:800; letter-spacing:-.02em}
.sess .mnu{font-size:10px; color:var(--t3); text-align:right; margin-top:1px}
.state{display:flex; align-items:center; gap:5px; font-size:11.5px; color:var(--mint-deep); margin-top:7px; font-weight:600}
.state.wait{color:var(--t3)}
.state.run{color:var(--lav)}

/* strategies */
.strat{display:flex; align-items:center; gap:11px; width:100%; text-align:left; font-family:inherit; background:none; border:0; border-bottom:1px solid var(--line); padding:11px 2px; cursor:pointer}
.strat:last-child{border-bottom:0}
.strat .st{font-size:13.5px; font-weight:700}
.strat .ss{font-size:11.5px; color:var(--t2); margin-top:2px; line-height:1.35}
.strat.done .st{color:var(--mint-deep)}
.strat.done .ss{text-decoration:line-through; color:var(--t3)}
.tag{font-size:10px; font-weight:800; letter-spacing:.06em; color:var(--mint-deep); text-transform:uppercase}
.badge{font-size:9.5px; font-weight:800; letter-spacing:.09em; text-transform:uppercase; padding:4px 8px; border-radius:7px; background:var(--mint); color:#04211A}

/* chart */
.legend{display:flex; gap:12px; margin-top:6px; font-size:9.5px; font-weight:700; letter-spacing:.05em; color:var(--t2); text-transform:uppercase}
.legend span{display:flex; align-items:center; gap:4px}
.legend i{width:6px;height:6px;border-radius:50%; display:block}

/* rewards */
.rw{display:flex; align-items:center; justify-content:space-between; padding:11px 2px; border-bottom:1px solid var(--line); gap:10px}
.rw:last-child{border-bottom:0}
.rw .rt{font-size:13.5px; font-weight:700}
.rw .rs{font-size:11.5px; color:var(--t3); margin-top:2px}
.rw .rp{font-size:13px; font-weight:800; color:var(--mint-deep); background:var(--mint-wash); padding:5px 9px; border-radius:8px}

/* tabbar */
.tabs{flex:0 0 78px; height:78px; display:flex; align-items:flex-start; justify-content:space-around; padding:9px 8px 0; background:rgba(255,255,255,.93); backdrop-filter:blur(18px); border-top:1px solid var(--line); position:relative}
.tab{flex:1; background:none; border:0; font-family:inherit; display:flex; flex-direction:column; align-items:center; gap:4px; color:#9BA7A5; cursor:pointer; padding:5px 0; transition:color .15s ease}
.tab span{font-size:10px; font-weight:600; letter-spacing:.01em}
.tab.on{color:var(--t1)}
.tab.on span{font-weight:700}
.tab:active{transform:scale(.94)}
.homebar{position:absolute; bottom:8px; left:50%; transform:translateX(-50%); width:134px; height:5px; border-radius:99px; background:#0C1413; opacity:.28}

.toast{position:absolute; left:50%; bottom:96px; transform:translateX(-50%) translateY(8px); background:rgba(8,12,11,.93); color:#fff; font-size:12px; font-weight:600; padding:10px 15px; border-radius:12px; opacity:0; pointer-events:none; transition:opacity .22s ease, transform .22s ease; z-index:50; white-space:nowrap; max-width:86%}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}


/* ---------- mascot + motion ---------- */
.mascot{display:inline-block; line-height:0; position:relative}
.mascot svg{overflow:visible; display:block}
.m-float{transform-box:fill-box; transform-origin:50% 50%; animation:mfloat 4.6s ease-in-out infinite}
@keyframes mfloat{0%,100%{transform:translateY(1.5%) scale(.985)}50%{transform:translateY(-2.5%) scale(1.035)}}
.m-eyes{transform-box:fill-box; transform-origin:50% 100%; animation:mblink 5.6s ease-in-out infinite}
@keyframes mblink{0%,84%,100%{transform:scaleY(1)}89%{transform:scaleY(.38)}93%{transform:scaleY(1.14)}}
.m-mouth{transform-box:fill-box; transform-origin:50% 0; animation:mmouth 4.6s ease-in-out infinite}
@keyframes mmouth{0%,100%{transform:scaleY(.94)}50%{transform:scaleY(1.2)}}
.m-halo{transform-box:fill-box; transform-origin:50% 50%; animation:mhalo 4.6s ease-in-out infinite}
@keyframes mhalo{0%,100%{opacity:.34; transform:scale(.94)}50%{opacity:.62; transform:scale(1.06)}}
.m-spin{transform-box:fill-box; transform-origin:50% 50%; animation:mspin 8.5s linear infinite}
@keyframes mspin{to{transform:rotate(360deg)}}
.m-gloss{transform-box:fill-box; transform-origin:50% 50%; animation:mgloss 6.2s ease-in-out infinite}
@keyframes mgloss{0%,100%{opacity:.82; transform:translate(0,0)}50%{opacity:1; transform:translate(2.5%,-2.5%)}}
.mascot.pop .m-float{animation:mpop .72s cubic-bezier(.34,1.56,.64,1)}
@keyframes mpop{0%{transform:scale(1)}28%{transform:scale(1.22) rotate(-6deg)}55%{transform:scale(.94) rotate(4deg)}100%{transform:scale(1) rotate(0)}}
.mascot:hover .m-float{animation:mpop .72s cubic-bezier(.34,1.56,.64,1)}

/* screen motion */
.body{animation:fadeup .3s cubic-bezier(.32,.72,0,1) both}
@keyframes fadeup{from{opacity:0; transform:translateY(7px)}to{opacity:1; transform:none}}
.bar>i{animation:grow .85s cubic-bezier(.4,0,.2,1) both}
@keyframes grow{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.ring-arc{animation:ringdraw 1.15s cubic-bezier(.4,0,.2,1) both}
@keyframes ringdraw{from{stroke-dashoffset:var(--c)}to{stroke-dashoffset:var(--o)}}
.chart-line{animation:draw 1.3s cubic-bezier(.4,0,.2,1) both}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.chart-dot{animation:popin .5s cubic-bezier(.34,1.56,.64,1) both; transform-box:fill-box; transform-origin:50% 50%}
@keyframes popin{from{transform:scale(0)}to{transform:scale(1)}}
.strat.done .ico{animation:popin .45s cubic-bezier(.34,1.56,.64,1)}
.tab.on svg{animation:popin .4s cubic-bezier(.34,1.56,.64,1)}

.screen svg text{font-family:var(--ff)}
.stack{display:flex; flex-direction:column; gap:11px}
.between{display:flex; align-items:center; justify-content:space-between; gap:10px}
.chev{color:var(--t3)}

@media (max-width:900px){
  .proto{grid-template-columns:1fr; justify-items:center; gap:26px}
  .proto-head{align-items:center; text-align:center; max-width:56ch}
  .chips{justify-content:center}
}
@media (max-width:460px){ :root{--s:.84} }
@media (max-width:400px){ :root{--s:.76} }
@media (max-width:360px){ :root{--s:.68} }
@media (prefers-reduced-motion:reduce){ *{transition:none !important; animation:none !important} }
</style>

</head>

/* weekly endurance trend chart */
const TREND=[90,91,92,93,94,96,94], DAYS=['M','T','W','T','F','S','S'];
const chart = n => {
  const W=300,H=118,PL=14,PR=14,PT=22,PB=24, lo=87.5, hi=97.5;
  const x=i=>PL+i*((W-PL-PR)/(TREND.length-1));
  const y=v=>PT+(hi-v)/(hi-lo)*(H-PT-PB);
  const pts=TREND.map((v,i)=>[x(i),y(v)]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=line+` L${x(6).toFixed(1)} ${H-PB} L${x(0).toFixed(1)} ${H-PB} Z`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Weekly endurance trend">
    <defs><linearGradient id="ar${n}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00E3A1" stop-opacity=".30"/><stop offset="1" stop-color="#00E3A1" stop-opacity="0"/></linearGradient></defs>
    ${[0,1,2].map(i=>`<line x1="${PL}" x2="${W-PR}" y1="${(PT+i*(H-PT-PB)/2).toFixed(1)}" y2="${(PT+i*(H-PT-PB)/2).toFixed(1)}" stroke="#E7EBEA" stroke-width="1"/>`).join('')}
    <path d="${area}" fill="url(#ar${n})"/>
    <path class="chart-line" pathLength="1" stroke-dasharray="1" d="${line}" fill="none" stroke="#0CB98A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    ${pts.map((p,i)=>`<circle class="chart-dot" style="animation-delay:${(.5+i*.08).toFixed(2)}s" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${i===5?4:3}" fill="${i===5?'#F2A33C':'#0CB98A'}" stroke="#fff" stroke-width="1.6"/>`).join('')}
    ${pts.map((p,i)=>`<text x="${p[0].toFixed(1)}" y="${(p[1]-9).toFixed(1)}" text-anchor="middle" font-family="var(--ff)" font-size="8.5" font-weight="700" fill="#6C7A78">${TREND[i]}</text>`).join('')}
    ${pts.map((p,i)=>`<text x="${p[0].toFixed(1)}" y="${H-7}" text-anchor="middle" font-family="var(--ff)" font-size="9" font-weight="600" fill="#9AA6A4">${DAYS[i]}</text>`).join('')}
  </svg>`;
};

         ['9:52 AM - 10:07 AM','Recovery 2 · Auto-pause new requests','var(--lav)']]
        .map(r=>`<div style="border-left:3px solid ${r[2]};padding:2px 0 2px 10px;margin-bottom:10px">
          <div class="tnum" style="font-size:12.5px;font-weight:700">${r[0]}</div>
          <div style="font-size:11.5px;color:var(--t2);margin-top:2px">${r[1]}</div></div>`).join('')}
    </div>`;
  }

  schedule(){
    return `<button class="backrow" data-act="go-plan" style="padding-top:8px">${I.back}</button>
    <h2 class="title" style="margin-bottom:14px">Schedule</h2>
    <div class="stack">
      ${SESSIONS.map((s,i)=>{
        const drive = s.t==='drive';
        const on = s.s==='run';
        const st = s.s==='done' ? `<div class="state">${I.check} Completed</div>`
          : on ? `<div class="bar" style="margin-top:9px;height:5px;background:#DCD6F9"><i style="width:${Math.round(s.p/s.m*100)}%;background:linear-gradient(90deg,#4B3BD1,#6C5CE7)"></i></div>
                  <div class="state run">In progress ${s.p}/${s.m} min</div>` : '';
        return `<button class="sess ${on?'on':''} ${this.pick===i?'pick':''}" data-act="sess" data-i="${i}">
          <div class="ico" style="${drive?'background:var(--lav-wash);color:var(--lav)':'background:var(--mint-wash);color:var(--mint-deep)'}">${drive?I.play:I.cup}</div>
          <div style="flex:1;min-width:0">
            <div class="nm">${s.n}</div>
            <div class="tm tnum">${s.a} - ${s.b}</div>
            ${st}
          </div>
          <div style="flex:0 0 auto"><div class="mn tnum">${s.m}</div><div class="mnu">min</div></div>
        </button>`;}).join('')}
    </div>`;
  }

  /* ---------- shell ---------- */
  render(){
    const r=this.route, tab = r==='schedule'?'plan':r;
    const TABS=[['home','Home',I.home],['plan','Plan',I.cal],['recovery','Recovery',I.heart],['rewards','Rewards',I.trophy]];
    this.host.innerHTML = `<div class="phone"><div class="screen">
      <div class="island"><i></i></div>
      <div class="statusbar"><span class="tnum">9:41</span><span class="sbr">${I.sig}${I.wifi}${I.bat}</span></div>
      <div class="body">${this[r]()}</div>
      <div class="toast"></div>
      <div class="tabs">
        ${TABS.map(t=>`<button class="tab ${tab===t[0]?'on':''}" data-act="tab" data-r="${t[0]}">${t[2]}<span>${t[1]}</span></button>`).join('')}
        <div class="homebar"></div>
      </div>
    </div></div>`;
    if(this.capEl) this.capEl.textContent = SCREEN_NAME[r];
    if(window.syncChips) window.syncChips(r);
    this.after();
  }

  after(){
    const rm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const c = this.host.querySelector('[data-count]');
    if(c && !rm){
      const end=+c.dataset.count; let t0=null; c.textContent='0';
      const step=ts=>{ if(t0===null) t0=ts; const k=Math.min((ts-t0)/900,1);
        c.textContent=Math.round(end*(1-Math.pow(1-k,3)));
        if(k<1) requestAnimationFrame(step); };
      requestAnimationFrame(step);
    }
    if(this.pop){
      this.pop=false;
      this.host.querySelectorAll('[data-mascot]').forEach(m=>{
        m.classList.remove('pop'); void m.offsetWidth; m.classList.add('pop');
        setTimeout(()=>m.classList.remove('pop'),820);
      });
    }
  }
}

/* ---------- mount: one phone, driven by the tab bar and the chips ---------- */
const CHIPS=[['home','司机首页'],['plan','驾驶计划'],['recovery','恢复窗口'],['rewards','奖励规则']];
const stage=document.getElementById('stage'), caption=document.getElementById('caption'), chips=document.getElementById('chips');
chips.innerHTML = CHIPS.map(c=>`<button class="chip" type="button" data-r="${c[0]}">${c[1]}</button>`).join('');
const syncChips = r => { const k = r==='schedule' ? 'plan' : r;
  chips.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on', c.dataset.r===k)); };
window.syncChips = syncChips;

const app = new App(stage, caption, 'home', 1);
const apps=[app];
syncChips('home');
document.getElementById('mark').innerHTML = mascot('mk',40);

/* scale the phone so the whole device, tab bar included, fits the window */
const head = document.querySelector('.proto-head');
const fit = () => {
  const stacked = window.innerWidth <= 900;
  const reserve = stacked ? (head ? head.offsetHeight : 200) + 190 : 180;
  const room = stacked ? window.innerWidth - 32 : window.innerWidth - 470;
  const s = Math.max(.55, Math.min(1, (window.innerHeight - reserve)/812, room/375));
  document.documentElement.style.setProperty('--s', s.toFixed(3));
};
fit();
window.addEventListener('resize', fit, {passive:true});

chips.addEventListener('click', e=>{
  const b=e.target.closest('.chip'); if(!b) return;
  app.go(b.dataset.r);
});

stage.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const act=b.dataset.act;
  if(act==='tab') return app.go(b.dataset.r);
  if(act==='go-schedule') return app.go('schedule');
  if(act==='go-plan') return app.go('plan');
  if(act==='uber') return app.toast('返回 Uber 司机端主应用…');
  if(act==='snooze'){
    if(app.snoozed) return;
    app.snoozed=true; app.pop=true; app.render(); app.toast('Recovery 2 pushed to 10:02 AM · 10 min later'); return;
  }
  if(act==='strat'){
    const i=+b.dataset.i, s=STRATS[i];
    if(app.done.has(i)){ app.done.delete(i); app.daily-=s.pts; app.today-=s.pts; app.reward-=s.pts; }
    else { app.done.add(i); app.daily=Math.min(100,app.daily+s.pts); app.today=Math.min(100,app.today+s.pts); app.reward+=s.pts; }
    app.pop=true; app.render(); if(app.done.has(i)) app.toast(`${s.t} logged · +${s.pts} pts`);
    return;
  }
  if(act==='redeem'){
    if(app.reward<500) return app.toast('Need 500 pts to redeem the next credit');
    app.reward-=500; app.pop=true; app.render(); app.toast('500 pts redeemed · $8 fuel credit applied'); return;
  }
  if(act==='sess'){
    const i=+b.dataset.i, s=SESSIONS[i];
    app.pick = app.pick===i?null:i; app.render();
    if(app.pick===i) app.toast(`${s.n} · ${s.a} - ${s.b} · ${s.m} min`);
    return;
  }
});

/* live recovery countdown, shared clock */
setInterval(()=>{
  apps.forEach(a=>{
    if(a.left>0) a.left--;
    if(a.route!=='recovery') return;
    const c=a.host.querySelector('[data-clock]'), f=a.host.querySelector('[data-fill]');
    if(c) c.textContent=mmss(a.left);
    if(f) f.style.width=(100-(a.left/3600)*100).toFixed(1)+'%';
  });
},1000);
