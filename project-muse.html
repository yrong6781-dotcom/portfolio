  <title>Muse AI | Rong Yan</title>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code&display=swap" />
  <link rel="stylesheet" href="project-detail.css?v=9" />
  <script>
    // zoom the first page in when the browser did not morph it from the project card
    (function () {
      var root = document.documentElement;
      if ("onpagereveal" in window) {
        window.addEventListener("pagereveal", function (e) {
          if (!e.viewTransition) {
            root.classList.add("enter-zoom");
            return;
          }
          // a skipped transition rejects these promises, which is expected
          e.viewTransition.ready.catch(function () {});
          e.viewTransition.finished.catch(function () {});
        }, { once: true });
      } else {
        root.classList.add("enter-zoom");
      }
    })();
  </script>
  <script src="project-detail.js?v=4" defer></script>
  <script src="site-extras.js?v=4" defer></script>
</head>

<body>
  <header class="detail-bar">
    <a class="detail-back" href="index.html#projects" aria-label="Back to projects">&#8592; &#60;/Projects&#62;</a>
    <div class="detail-bar-right">
      <div class="detail-bar-info">
        <span class="detail-bar-title">Muse AI</span>
        <span class="detail-bar-meta">UI/UX设计 · 小程序</span>
      </div>

    </div>
  </header>

  <main class="detail-main">
    <!-- Detail page images, stacked top to bottom -->
    <div class="detail-pages">
      <img src="src/projects/muse/01.jpg" alt="Muse AI 封面" width="1920" height="1080" style="view-transition-name: muse-cover" />
      <img src="src/projects/muse/02.jpg" alt="项目背景" width="1920" height="1080" decoding="async" />
      <img src="src/projects/muse/03.jpg" alt="核心功能 个性化设置" width="1920" height="2328" loading="lazy" decoding="async" />
      <img src="src/projects/muse/04.jpg" alt="核心功能 多模态展品识别" width="1920" height="2207" loading="lazy" decoding="async" />
      <img src="src/projects/muse/05.jpg" alt="核心功能 动态 AI 讲解与路线规划" width="1920" height="2167" loading="lazy" decoding="async" />
      <img src="src/projects/muse/06.jpg?v=2" alt="原型展示" width="1920" height="3991" loading="lazy" decoding="async" />
    </div>

    <div class="detail-end">
      <a class="detail-back" href="index.html#projects">&#8592; Back to projects</a>
    </div>
  </main>
