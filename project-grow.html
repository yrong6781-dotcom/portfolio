  <script>
    // zoom the first page in when the browser did not morph it from the project card
    (function () {
      var root = document.documentElement;
      if ("onpagereveal" in window) {
        window.addEventListener("pagereveal", function (e) {
          if (!e.viewTransition) {
            root.classList.add("enter-zoom");
            return;
          }
          // a skipped transition rejects these promises, which is expected
          e.viewTransition.ready.catch(function () {});
          e.viewTransition.finished.catch(function () {});
        }, { once: true });
      } else {
        root.classList.add("enter-zoom");
      }
    })();
  </script>
